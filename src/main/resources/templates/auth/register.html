<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Registrera - CloudStore</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="auth-page">

<div class="auth-container">
    <div class="auth-logo">&#9729; CloudStore</div>
    <h1 class="auth-title">Skapa konto</h1>

    <div th:if="${errorMsg}" class="alert alert-error" th:text="${errorMsg}"></div>
    <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>

    <form method="post" th:action="@{/register}" class="auth-form">
        <div class="form-group">
            <label for="username">Användarnamn</label>
            <input type="text" id="username" name="username" required="required"/>
        </div>
        <div class="form-group">
            <label for="email">E-post</label>
            <input type="email" id="email" name="email" required="required"/>
        </div>
        <div class="form-group">
            <label for="password">Lösenord</label>
            <input type="password" id="password" name="password" required="required"/>
        </div>
        <div class="form-group">
            <label for="confirmPassword">Bekräfta lösenord</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required="required"/>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Registrera</button>
    </form>

    <p class="auth-link">
        Redan konto? <a th:href="@{/login}">Logga in här</a>
    </p>
</div>

</body>
</html>
