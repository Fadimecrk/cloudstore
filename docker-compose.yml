version: '3.8'

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cloudstore
      MYSQL_USER: clouduser
      MYSQL_PASSWORD: cloudpass
    ports:
      - "3306:3306"

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/cloudstore
      SPRING_DATASOURCE_USERNAME: clouduser
      SPRING_DATASOURCE_PASSWORD: cloudpass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - db